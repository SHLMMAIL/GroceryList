<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#f7f8f5"><title>Grocery List</title><style>
*{box-sizing:border-box}body{margin:0;background:#f7f8f5;color:#202923;font:16px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}main{max-width:560px;margin:auto;padding:24px 16px calc(32px + env(safe-area-inset-bottom))}h1{font-size:32px;letter-spacing:-1px;margin:8px 0}h2{font-size:17px;margin:24px 0 10px}p{margin:6px 0;color:#65716a}button,input{font:inherit}button{cursor:pointer;min-height:44px;border:0;border-radius:12px;background:#e8ede7;color:#244b36;font-weight:600;padding:10px 14px}button.primary{background:#276644;color:white}button:focus-visible,input:focus-visible{outline:3px solid #85b39a;outline-offset:2px}input{min-height:48px;border:1px solid #d8ded8;border-radius:10px;padding:12px;width:100%;background:white;color:#202923}label{font-size:13px;color:#58665d;display:block;margin-bottom:5px;font-weight:600}.card{background:white;border:1px solid #e0e5df;border-radius:16px;padding:14px;margin-top:18px}.line{display:flex;gap:10px;align-items:center}.grow{flex:1;min-width:0}.fields{display:grid;grid-template-columns: minmax(0,1fr) 94px;gap:10px;margin-bottom:10px}.full{width:100%;margin-top:10px}.tabs{display:flex;gap:6px;margin:20px 0}.tabs button{flex:1}.tabs .active{background:#276644;color:white}.item{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid #e9ece8}.item:last-child{border-bottom:0}.check{width:44px;height:44px;flex:none;border:2px solid #a2b4a6;background:white;font-size:23px;padding:0}.done .check{background:#276644;color:white;border-color:#276644}.done .name{text-decoration:line-through;color:#748078}.name{font-weight:650;overflow-wrap:anywhere}.note{font-size:14px;color:#68736c;overflow-wrap:anywhere;margin-top:4px}.small{font-size:14px}.quiet{background:transparent;color:#52645a}.danger{color:#a23939;background:#f9eded}.chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}.chips button{font-weight:500;background:#eff4ed}.progress{height:6px;border-radius:10px;background:#e2e9df;overflow:hidden;margin-top:12px}.progress div{height:100%;background:#398354;transition:width .2s}.empty{text-align:center;padding:18px 5px;color:#68736c}.hidden,[hidden]{display:none!important}dialog{width:calc(100% - 32px);max-width:440px;border:0;border-radius:16px;padding:20px;box-shadow:0 12px 60px #0003}dialog::backdrop{background:#0006}#status{font-size:13px;color:#a23939} .sectionhead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:20px}.sectionhead h2{margin:0}button:disabled{opacity:.45;cursor:default}.group-fields{display:grid;grid-template-columns:minmax(0,1fr) 85px;gap:8px}.group-entry{border-bottom:1px solid #e0e5df;padding:12px 0}.group-entry:last-child{border:0}#groupDialog{max-height:85dvh;overflow:auto}.tabs button{padding:10px 7px;font-size:14px}#dbList .item{gap:5px;flex-wrap:wrap}#dbList .item .grow{flex:1 1 105px}#dbList .item button{padding:10px 8px}.bulkbar{position:sticky;top:0;z-index:2;background:#f7f8f5;padding:8px 0}.bulkbar .line{flex-wrap:wrap}.bulkcheck{width:28px;height:28px;min-height:0;flex:none;accent-color:#276644;margin:8px}.bulklabel{display:flex;align-items:center;gap:8px;flex:1;min-height:44px;margin:0;font-size:16px;color:#202923}.bulklabel input{width:28px;min-height:0}.bulkbar p{margin:4px 0}#dbTitle{flex:1}.sectionhead:has(#dbTitle){flex-wrap:wrap}</style></head><body><main><header><h1>Grocery List</h1><p id="summary"></p><div class="progress" role="progressbar" aria-label="Shopping progress" aria-valuemin="0" aria-valuemax="100" id="progress"><div></div></div></header><nav class="tabs" aria-label="Views"><button id="listTab" class="active" aria-pressed="true">Shopping list</button><button id="dbTab" aria-pressed="false">Saved items</button><button id="groupsTab" aria-pressed="false">Groups</button></nav><section id="shopping"><form class="card" id="addForm"><div class="fields"><div><label for="name">Item</label><input id="name" placeholder="e.g. Milk" required autocomplete="off" maxlength="100"></div><div><label for="qty">Quantity</label><input id="qty" value="1" maxlength="30" placeholder="1"></div></div><div id="suggestions" class="chips"></div><label for="notes">Notes (optional)</label><input id="notes" placeholder="Brand, size, etc." maxlength="300"><button class="primary full" type="submit">+ Add to list</button></form><h2>Quick add groups</h2><div id="quickGroups" class="chips"></div><h2>Quick add</h2><p class="small">Tap a saved item to add it.</p><div id="quick" class="chips"></div><div class="sectionhead"><h2 id="remainingTitle">To buy</h2></div><div class="card" id="remaining"></div><div class="sectionhead"><h2 id="purchasedTitle">Purchased</h2><button id="clear" class="quiet small">Clear purchased</button></div><div class="card" id="purchased"></div></section><section id="database" hidden><div class="card"><label for="search">Find saved items</label><input id="search" type="search" placeholder="Search groceries"><form id="dbForm" class="line" style="margin-top:12px"><input id="dbName" placeholder="New saved item" required maxlength="100" aria-label="New saved item"><button class="primary" type="submit">Add</button></form></div><div class="sectionhead"><h2 id="dbTitle">Item database</h2><button id="bulkToggle">Bulk add</button><button id="bulkDeleteToggle" class="danger">Bulk delete</button></div><div id="bulkBar" class="bulkbar" hidden><div class="line"><button id="bulkAll">Select all matching</button><button id="bulkClear">Clear selection</button></div><button id="bulkAdd" class="primary full" disabled>Add selected (0)</button><p id="bulkCount" class="small" role="status"></p></div><p id="bulkStatus" role="status" class="small"></p><div class="card" id="dbList"></div></section><section id="groups" hidden><div class="line"><button class="primary grow" id="newGroup">+ New group</button><button class="grow" id="fromList">Save current list</button></div><h2>Saved groups</h2><div class="card" id="groupList"></div></section><p id="groupStatus" role="status"></p><p id="status" role="status"></p></main><dialog id="edit"><form id="editForm"><h2 style="margin-top:0">Edit item</h2><label for="editName">Item</label><input id="editName" required maxlength="100"><label for="editQty" style="margin-top:12px">Quantity</label><input id="editQty" maxlength="30"><label for="editNotes" style="margin-top:12px">Notes</label><input id="editNotes" maxlength="300"><button class="primary full">Save changes</button><div class="line" style="margin-top:10px"><button type="button" id="deleteItem" class="danger grow">Remove</button><button type="button" id="cancel" class="grow">Cancel</button></div></form></dialog><dialog id="dbEdit"><form id="dbEditForm"><h2 style="margin-top:0">Edit saved item</h2><label for="dbEditName">Item name</label><input id="dbEditName" required maxlength="100"><p class="small">Renames this item in your shopping list and saved groups too.</p><p id="dbEditError" role="alert" style="color:#a23939"></p><button class="primary full" type="submit">Save changes</button><button type="button" id="dbEditCancel" class="full">Cancel</button></form></dialog><dialog id="groupDialog"><form id="groupForm"><h2 style="margin-top:0">Shopping group</h2><label for="groupName">Group name</label><input id="groupName" required maxlength="100" placeholder="e.g. Weekly groceries"><datalist id="savedNames"></datalist><div id="groupEntries"></div><button type="button" id="addGroupEntry" class="full">+ Add item</button><button type="submit" class="primary full">Save group</button><button type="button" id="cancelGroup" class="full">Cancel</button></form></dialog><script>
'use strict';const $=id=>document.getElementById(id), key='grocery-list-v1',norm=s=>s.trim().toLowerCase();let state={items:[],db:['Milk','Eggs','Bread','Butter','Cheese','Chicken','Apples','Bananas','Lettuce','Tomatoes','Potatoes','Rice','Pasta','Coffee','Yogurt'].map(name=>({name,uses:0}))};try{const raw=localStorage.getItem(key);if(raw){const s=JSON.parse(raw);if(Array.isArray(s.items)&&Array.isArray(s.db))state=s;}}catch(e){$('status').textContent='Saved data could not be loaded.'}if(!Array.isArray(state.groups))state.groups=[];function save(){try{localStorage.setItem(key,JSON.stringify(state));}catch(e){$('status').textContent='Storage unavailable. Changes may be lost when you close this page.'}render()}function remember(name,used=false){let d=state.db.find(x=>norm(x.name)===norm(name));if(!d){d={name,uses:0};state.db.push(d)}if(used)d.uses++;return d.name}function add(name,qty='1',notes=''){name=name.trim();if(!name)return;name=remember(name,true);state.items.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2),name,qty:qty.trim()||'1',notes:notes.trim(),done:false});save()}function button(label,fn,cls){const b=document.createElement('button');b.type='button';b.textContent=label;if(cls)b.className=cls;b.onclick=fn;return b}function el(tag,cls,txt){const e=document.createElement(tag);if(cls)e.className=cls;if(txt!==undefined)e.textContent=txt;return e}function renderItems(target,items,empty){target.replaceChildren();if(!items.length){target.append(el('div','empty',empty));return}for(const item of items){const row=el('div','item'+(item.done?' done':''));const check=button(item.done?'✓':'',()=>{item.done=!item.done;save()},'check');check.setAttribute('aria-label',(item.done?'Uncheck ':'Purchase ')+item.name);check.setAttribute('aria-pressed',String(item.done));const body=el('div','grow');body.append(el('div','name',item.name),el('div','note','Qty: '+item.qty+(item.notes?' · '+item.notes:'')));const edit=button('Edit',()=>openEdit(item),'quiet small');edit.setAttribute('aria-label','Edit '+item.name);row.append(check,body,edit);target.append(row)}}function available(){return state.db.filter(d=>!state.items.some(i=>!i.done&&norm(i.name)===norm(d.name)))}function suggestions(){const q=norm($('name').value);$('suggestions').replaceChildren();if(q)for(const d of state.db.filter(d=>norm(d.name).includes(q)).slice(0,5))$('suggestions').append(button(d.name,()=>{$('name').value=d.name;$('suggestions').replaceChildren();$('qty').focus()}))}function render(){const remaining=state.items.filter(i=>!i.done),done=state.items.filter(i=>i.done);$('summary').textContent=remaining.length+' to buy · '+done.length+' purchased';let pct=state.items.length?Math.round(done.length/state.items.length*100):0;$('progress').firstElementChild.style.width=pct+'%';$('progress').setAttribute('aria-valuenow',pct);$('remainingTitle').textContent='To buy ('+remaining.length+')';$('purchasedTitle').textContent='Purchased ('+done.length+')';$('clear').disabled=!done.length;renderItems($('remaining'),remaining,'Your list is empty. Add something above.');renderItems($('purchased'),done,'No purchased items yet.');$('quick').replaceChildren();for(const d of available().sort((a,b)=>b.uses-a.uses||a.name.localeCompare(b.name)).slice(0,12))$('quick').append(button('+ '+d.name,()=>add(d.name)));renderDB();suggestions();renderGroups()}let bulkMode=false;let bulkDeleting=false;const selectedDB=new Set();function bulkAvailable(d){return bulkDeleting||!state.items.some(i=>!i.done&&norm(i.name)===norm(d.name))}function matchingDB(){const q=norm($('search').value);return state.db.filter(d=>norm(d.name).includes(q)).sort((a,b)=>a.name.localeCompare(b.name))}function refreshBulk(){for(const d of selectedDB)if(!state.db.includes(d)||!bulkAvailable(d))selectedDB.delete(d);const n=selectedDB.size;$('bulkAdd').textContent=(bulkDeleting?'Delete selected (':'Add selected (')+n+')';$('bulkAdd').className=bulkDeleting?'danger full':'primary full';$('bulkAdd').disabled=!n;$('bulkClear').disabled=!n;$('bulkAll').disabled=!matchingDB().some(d=>bulkAvailable(d)&&!selectedDB.has(d));$('bulkCount').textContent=n+' selected · selections retained when searching'}function renderDB(){$('dbTitle').textContent='Item database ('+state.db.length+')';$('dbList').replaceChildren();const list=matchingDB();refreshBulk();if(!list.length)$('dbList').append(el('div','empty','No matching items.'));for(const d of list){const row=el('div','item');if(bulkMode){const label=el('label','bulklabel'), check=el('input','bulkcheck');check.type='checkbox';check.disabled=!bulkAvailable(d);check.checked=selectedDB.has(d);check.onchange=()=>{if(check.checked)selectedDB.add(d);else selectedDB.delete(d);refreshBulk()};label.append(check,el('span','name',d.name));row.append(label);if(check.disabled)row.append(el('span','note','Already on list'))}else{row.append(el('div','grow name',d.name),button('+ List',()=>add(d.name)),button('Edit',()=>openDBEdit(d),'quiet small'),button('Remove',()=>{if(confirm('Remove '+d.name+' from saved items?')){state.db=state.db.filter(x=>x!==d);save()}},'quiet small'))}$('dbList').append(row)}}function setBulk(mode){bulkMode=!!mode;bulkDeleting=mode==='delete';selectedDB.clear();$('bulkBar').hidden=!bulkMode;$('bulkToggle').hidden=bulkDeleting;$('bulkDeleteToggle').hidden=bulkMode&&!bulkDeleting;$('bulkToggle').textContent=bulkMode?'Cancel':'Bulk add';$('bulkDeleteToggle').textContent=bulkDeleting?'Cancel':'Bulk delete';$('bulkStatus').textContent='';renderDB()}$('bulkToggle').onclick=()=>setBulk(bulkMode?null:'add');$('bulkDeleteToggle').onclick=()=>setBulk(bulkMode?null:'delete');$('bulkAll').onclick=()=>{for(const d of matchingDB())if(bulkAvailable(d))selectedDB.add(d);renderDB()};$('bulkClear').onclick=()=>{selectedDB.clear();renderDB()};$('bulkAdd').onclick=()=>{if(bulkDeleting){const targets=state.db.filter(d=>selectedDB.has(d));const n=targets.length;if(!n||!confirm('Delete '+n+' selected item(s) from the database? Shopping lists and groups will be kept.'))return;state.db=state.db.filter(d=>!selectedDB.has(d));selectedDB.clear();save();$('bulkStatus').textContent=n+' item(s) deleted from the database.';return}let n=0;for(const d of selectedDB){if(!state.db.includes(d)||!bulkAvailable(d))continue;const name=remember(d.name,true);state.items.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2),name,qty:'1',notes:'',done:false});n++}selectedDB.clear();save();$('bulkStatus').textContent=n+' item'+(n===1?'':'s')+' added to your shopping list.'};let editingDB=null;function openDBEdit(d){editingDB=d;$('dbEditName').value=d.name;$('dbEditError').textContent='';$('dbEdit').showModal()}$('dbEditCancel').onclick=()=>$('dbEdit').close();$('dbEditForm').onsubmit=e=>{e.preventDefault();const name=$('dbEditName').value.trim();if(!name){$('dbEditError').textContent='Enter an item name.';return}if(state.db.some(d=>d!==editingDB&&norm(d.name)===norm(name))){$('dbEditError').textContent='An item with this name already exists.';return}const old=norm(editingDB.name);editingDB.name=name;for(const i of state.items)if(norm(i.name)===old)i.name=name;for(const g of state.groups)for(const i of g.items)if(norm(i.name)===old)i.name=name;$('dbEdit').close();save()};let editing=null;function openEdit(i){editing=i;$('editName').value=i.name;$('editQty').value=i.qty;$('editNotes').value=i.notes;$('edit').showModal()}$('editForm').onsubmit=e=>{e.preventDefault();if(!$('editName').value.trim())return;editing.name=remember($('editName').value.trim());editing.qty=$('editQty').value.trim()||'1';editing.notes=$('editNotes').value.trim();$('edit').close();save()};$('cancel').onclick=()=>$('edit').close();$('deleteItem').onclick=()=>{state.items=state.items.filter(i=>i!==editing);$('edit').close();save()};$('addForm').onsubmit=e=>{e.preventDefault();if(!$('name').value.trim())return;add($('name').value,$('qty').value,$('notes').value);e.target.reset();suggestions();$('name').blur()};$('name').oninput=suggestions;$('search').oninput=renderDB;$('dbForm').onsubmit=e=>{e.preventDefault();if($('dbName').value.trim())remember($('dbName').value.trim());e.target.reset();save()};$('clear').onclick=()=>{if(confirm('Clear all purchased items? Saved items will be kept.')){state.items=state.items.filter(i=>!i.done);save()}};function tab(view){for(const [section,id] of [['shopping','listTab'],['database','dbTab'],['groups','groupsTab']]){const on=section===view;$(section).hidden=!on;$(id).classList.toggle('active',on);$(id).setAttribute('aria-pressed',String(on))}}$('listTab').onclick=()=>tab('shopping');$('dbTab').onclick=()=>tab('database');$('groupsTab').onclick=()=>tab('groups');
let editingGroup=null;
function groupEntry(item={name:'',qty:'1',notes:''}){const row=el('div','group-entry'), fields=el('div','group-fields');function field(label,value,placeholder,max){const wrap=el('div'), lab=el('label','',label), input=el('input');input.value=value;input.placeholder=placeholder;input.maxLength=max;input.setAttribute('aria-label',label);wrap.append(lab,input);return [wrap,input]}const [nw,n]=field('Item',item.name,'Milk',100),[qw,q]=field('Quantity',item.qty,'1',30),[ow,o]=field('Notes',item.notes,'Optional',300);n.setAttribute('list','savedNames');n.required=true;fields.append(nw,qw);row.append(fields,ow,button('Remove item',()=>row.remove(),'quiet small'));row.read=()=>({name:n.value.trim(),qty:q.value.trim()||'1',notes:o.value.trim()});$('groupEntries').append(row)}
function openGroup(g=null,items=null){editingGroup=g;$('groupName').value=g?g.name:'';$('groupEntries').replaceChildren();$('savedNames').replaceChildren();for(const d of state.db){const opt=el('option');opt.value=d.name;$('savedNames').append(opt)}for(const i of (items||g?.items||[{}]))groupEntry({name:i.name||'',qty:i.qty||'1',notes:i.notes||''});$('groupDialog').showModal()}
$('newGroup').onclick=()=>openGroup();$('fromList').onclick=()=>openGroup(null,state.items.filter(i=>!i.done));$('addGroupEntry').onclick=()=>groupEntry();$('cancelGroup').onclick=()=>$('groupDialog').close();$('groupForm').onsubmit=e=>{e.preventDefault();const name=$('groupName').value.trim(),items=Array.from($('groupEntries').children).map(r=>r.read());if(!name||!items.length||items.some(i=>!i.name)){alert('Enter a group name and at least one item.');return}if(state.groups.some(g=>g!==editingGroup&&norm(g.name)===norm(name))){alert('A group with this name already exists.');return}for(const i of items)i.name=remember(i.name);if(editingGroup){editingGroup.name=name;editingGroup.items=items}else state.groups.push({name,items});$('groupDialog').close();save()};
function addGroup(g){let added=0,skipped=0;for(const i of g.items){if(state.items.some(x=>!x.done&&norm(x.name)===norm(i.name))){skipped++;continue}state.items.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2),name:remember(i.name,true),qty:i.qty,notes:i.notes,done:false});added++}save();$('groupStatus').textContent=g.name+': '+added+' added'+(skipped?', '+skipped+' already on list (unchanged)':'')+'.';tab('shopping')}
function renderGroups(){$('quickGroups').replaceChildren();$('groupList').replaceChildren();$('fromList').disabled=!state.items.some(i=>!i.done);if(!state.groups.length){$('quickGroups').append(button('+ Create a group',()=>{tab('groups');openGroup()}));$('groupList').append(el('div','empty','Create a reusable group of groceries.'));return}for(const g of state.groups){$('quickGroups').append(button('+ '+g.name,()=>addGroup(g)));const row=el('div','group-entry'), head=el('div','line');head.append(el('div','grow name',g.name),button('+ List',()=>addGroup(g)));row.append(head,el('div','note',g.items.map(i=>i.qty+' × '+i.name+(i.notes?' ('+i.notes+')':'')).join(' · ')));const actions=el('div','line');actions.append(button('Edit',()=>openGroup(g),'quiet small'),button('Delete',()=>{if(confirm('Delete group '+g.name+'?')){state.groups=state.groups.filter(x=>x!==g);save()}},'quiet small'));row.append(actions);$('groupList').append(row)}}render();</script></body></html>
